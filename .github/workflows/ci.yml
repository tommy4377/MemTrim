name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install frontend dependencies
        working-directory: MemTrim/ui
        run: npm install
      - name: Check frontend
        working-directory: MemTrim/ui
        run: npm run check
      - name: Build frontend
        working-directory: MemTrim/ui
        run: npm run build
      - name: Check Rust formatting
        working-directory: MemTrim/src-tauri
        run: cargo fmt --check
      - name: Check Rust
        working-directory: MemTrim/src-tauri
        run: cargo check
