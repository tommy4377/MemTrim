name: Release portable

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  portable-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        working-directory: MemTrim/ui
        run: npm install
      - name: Build frontend
        working-directory: MemTrim/ui
        run: npm run build
      - name: Build portable executable
        working-directory: MemTrim/src-tauri
        run: cargo build --release
      - name: Publish portable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" "MemTrim/src-tauri/target/release/MemTrim.exe#MemTrim.exe" --title "MemTrim $env:GITHUB_REF_NAME" --generate-notes
