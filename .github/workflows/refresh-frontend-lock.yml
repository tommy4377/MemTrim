name: Refresh frontend lockfile

on:
  push:
    branches:
      - dependabot/npm_and_yarn/MemTrim/ui/frontend-dependencies-17230d796c
    paths:
      - '.github/workflows/refresh-frontend-lock.yml'

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dependabot/npm_and_yarn/MemTrim/ui/frontend-dependencies-17230d796c

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Regenerate lockfile
        working-directory: MemTrim/ui
        run: npm install --package-lock-only

      - name: Commit regenerated lockfile and remove helper workflow
        shell: bash
        run: |
          git config user.name "Tommaso Verardi"
          git config user.email "129632197+tommy4377@users.noreply.github.com"
          git add MemTrim/ui/package-lock.json
          git rm .github/workflows/refresh-frontend-lock.yml
          git commit -m "chore(deps): refresh frontend lockfile"
          git push origin HEAD:dependabot/npm_and_yarn/MemTrim/ui/frontend-dependencies-17230d796c
