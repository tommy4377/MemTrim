version: 2
updates:
  - package-ecosystem: npm
    directory: /MemTrim/ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      frontend-dependencies:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /MemTrim/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      rust-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
