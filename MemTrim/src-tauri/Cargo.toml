[package]
name = "MemTrim"
version = "1.0.1"
license = "MIT"
edition = "2021"
publish = false
authors = ["tommy4377"]
description = "Portable Windows memory optimization utility"
repository = "https://github.com/tommy4377/MemTrim"
homepage = "https://github.com/tommy4377/MemTrim"
build = "build.rs"

[dependencies]
image = "0.25"
tiny-skia = "0.12"
rusttype = "0.9"

anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
bitflags = { version = "2", features = ["serde"] }

tokio = { version = "1", features = ["time", "sync"] }

once_cell = "1.19"
scopeguard = "1.2"
parking_lot = "0.12"
dirs = "6.0"
rand = "0.9"

memmap2 = "0.9"
page_size = "0.6"
thread-control = "0.1"
winrt-notification = "0.5"

windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authentication",
  "Win32_Security_Authentication_Identity",
  "Win32_System_Threading",
  "Win32_System_Memory",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_ProcessStatus",
  "Win32_Storage_FileSystem",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_HiDpi",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Ioctl",
  "Win32_System_IO",
  "Win32_System_Registry",
  "Win32_System_EventLog",
  "Win32_System_LibraryLoader",
  "Win32_System_Console",
] }

ntapi = "0.4"
mslnk = "0.1"

tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
devtools = ["tauri/devtools"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[package.metadata.tauri-winres]
OriginalFilename = "MemTrim.exe"
ProductName = "MemTrim"
CompanyName = "tommy4377"
FileDescription = "Portable memory optimization utility for Windows"
LegalCopyright = "© 2025-2026 tommy4377"
